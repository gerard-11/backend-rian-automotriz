services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rian_automotriz_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rian_automotriz?schema=public
      JWT_SECRET: local-docker-jwt-secret-change-me-32
      CORS_ORIGIN: http://localhost:5173
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: rian_automotriz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rian_automotriz
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rian_automotriz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

